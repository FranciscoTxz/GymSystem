info:
  name: membership info update
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{URL}}/membership/info/full"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  body:
    type: json
    data: |-
      {
        "price": 500.0,
        "description": "Full for a year"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
