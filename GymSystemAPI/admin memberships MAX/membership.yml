info:
  name: membership
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/membership/info/normal"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
