info:
  name: all statistics
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/statistics"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: membership
      value: full
      type: query
      disabled: true
    - name: year
      value: "2026"
      type: query
      disabled: true
    - name: month
      value: "8"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
