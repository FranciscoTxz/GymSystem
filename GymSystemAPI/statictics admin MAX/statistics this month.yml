info:
  name: statistics this month
  type: http
  seq: 2

http:
  method: GET
  url: "{{URL}}/statistics/current"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: membership
      value: full
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
