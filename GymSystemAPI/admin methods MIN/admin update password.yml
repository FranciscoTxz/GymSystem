info:
  name: admin update password
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{URL}}/admin/password"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  body:
    type: json
    data: |-
      {
        "old_password": "PassWord1234@",
        "new_password": "PassWord1234*"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
