info:
  name: update membership user
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{URL}}/user/membership/1"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  body:
    type: json
    data: |-
      {
        "membership": "day"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
