info:
  name: all users
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/user"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: limit
      value: "1"
      type: query
      disabled: true
    - name: next_cursor
      value: "1"
      type: query
      disabled: true
    - name: name
      value: Al
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
